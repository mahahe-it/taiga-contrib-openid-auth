name: Renovate
on:
  schedule:
    - cron: "23 5 * * 1-5"   # weekdays, before working hours (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3.4.0
        id: app-token
        with:
          client-id: ${{ vars.MAHAHE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MAHAHE_BOT_PRIVATE_KEY }}

      - uses: renovatebot/github-action@v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commit through the API: GitHub signs them, as main requires
          RENOVATE_PLATFORM_COMMIT: enabled
